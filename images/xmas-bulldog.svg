<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 124" width="120" height="124" aria-hidden="true">
  <defs>
    <!-- Rich red-fawn English Bulldog coat gradient -->
    <radialGradient id="coatFawn" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#e3a86b"/>
      <stop offset="55%" stop-color="#c98447"/>
      <stop offset="100%" stop-color="#9e5d2a"/>
    </radialGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5a28"/>
      <stop offset="100%" stop-color="#6b3a16"/>
    </linearGradient>
    <radialGradient id="noseRopeGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#dca064"/>
      <stop offset="70%" stop-color="#b67038"/>
      <stop offset="100%" stop-color="#874c1f"/>
    </radialGradient>
    <radialGradient id="jowlGrad" cx="50%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#f7efe6"/>
      <stop offset="100%" stop-color="#dfd0bf"/>
    </radialGradient>
    <radialGradient id="noseGrad" cx="42%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#5a4c47"/>
      <stop offset="35%" stop-color="#2b211e"/>
      <stop offset="100%" stop-color="#140f0d"/>
    </radialGradient>
    <linearGradient id="hatRed" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#ee3346"/>
      <stop offset="55%" stop-color="#c9182b"/>
      <stop offset="100%" stop-color="#8d0c1a"/>
    </linearGradient>
    <linearGradient id="furTrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f0f3f7"/>
      <stop offset="100%" stop-color="#d5dde7"/>
    </linearGradient>
    <radialGradient id="goldBell" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="50%" stop-color="#e8b83d"/>
      <stop offset="100%" stop-color="#9e7114"/>
    </radialGradient>
  </defs>

  <!-- Gold ornament hanging ring at top -->
  <circle cx="60" cy="6.5" r="4.5" fill="none" stroke="#f3dc94" stroke-width="2.6"/>

  <!-- Small, high-set, backward-folded English Bulldog ROSE EARS -->
  <path d="M23 44 C13 40, 8 46, 10 54 C11.5 59, 17 59, 22 54 Z" fill="url(#earGrad)" stroke="#5c3112" stroke-width="1.4"/>
  <path d="M12.5 50 C14 54, 17.5 54, 20.5 50.5" fill="none" stroke="#4f290e" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M97 44 C107 40, 112 46, 110 54 C108.5 59, 103 59, 98 54 Z" fill="url(#earGrad)" stroke="#5c3112" stroke-width="1.4"/>
  <path d="M107.5 50 C106 54, 102.5 54, 99.5 50.5" fill="none" stroke="#4f290e" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Thick neck/collar hint at base -->
  <path d="M32 103 Q60 116 88 103 L84 111 Q60 120 36 111 Z" fill="#b81628" stroke="#780b17" stroke-width="1.2"/>

  <!-- BROAD, HEAVY, PEAR-SHAPED ENGLISH BULLDOG SKULL + WIDE CHEEKS -->
  <path d="M24 44
           C23 31, 97 31, 96 44
           C102 56, 107 72, 103 86
           C99 99, 86 107, 60 107
           C34 107, 21 99, 17 86
           C13 72, 18 56, 24 44 Z"
        fill="url(#coatFawn)" stroke="#6e3d19" stroke-width="1.8"/>

  <!-- Classic white vertical forehead blaze between eyes -->
  <path d="M54 39 Q60 36 66 39 L64 62 Q60 65 56 62 Z" fill="#fffaf3" opacity="0.95"/>

  <!-- Deep English Bulldog forehead furrow & horizontal brow wrinkles -->
  <path d="M60 41 L60 59" fill="none" stroke="#854b20" stroke-width="1.9" stroke-linecap="round" opacity="0.7"/>
  <path d="M35 45 Q47 41 56 46" fill="none" stroke="#7c441c" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M85 45 Q73 41 64 46" fill="none" stroke="#7c441c" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M31 51 Q44 47 54 52" fill="none" stroke="#8c5024" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M89 51 Q76 47 66 52" fill="none" stroke="#8c5024" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Heavy side cheek rolls -->
  <path d="M22 65 C18 74, 19 84, 24 91" fill="none" stroke="#854b20" stroke-width="2" stroke-linecap="round"/>
  <path d="M98 65 C102 74, 101 84, 96 91" fill="none" stroke="#854b20" stroke-width="2" stroke-linecap="round"/>

  <!-- Wide-set, low-set soulful English Bulldog eyes tucked under heavy brow -->
  <!-- Dark eye rims -->
  <ellipse cx="38" cy="62" rx="7.2" ry="6.4" fill="#2c1d17"/>
  <ellipse cx="82" cy="62" rx="7.2" ry="6.4" fill="#2c1d17"/>
  <!-- Warm dark-brown irises -->
  <circle cx="38.4" cy="62.2" r="5.2" fill="#462819"/>
  <circle cx="81.6" cy="62.2" r="5.2" fill="#462819"/>
  <!-- Deep pupils -->
  <circle cx="38.5" cy="62.2" r="3.4" fill="#170f0c"/>
  <circle cx="81.5" cy="62.2" r="3.4" fill="#170f0c"/>
  <!-- Bright catchlights -->
  <circle cx="40.3" cy="60.1" r="1.8" fill="#ffffff"/>
  <circle cx="83.3" cy="60.1" r="1.8" fill="#ffffff"/>
  <circle cx="36.6" cy="64" r="0.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="79.6" cy="64" r="0.8" fill="#ffffff" opacity="0.8"/>
  <!-- Heavy overhanging upper eyelids (gives that authentic soulful bulldog gaze!) -->
  <path d="M29.5 58.5 Q38 54 46.5 58.5" fill="none" stroke="#703d18" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M73.5 58.5 Q82 54 90.5 58.5" fill="none" stroke="#703d18" stroke-width="2.6" stroke-linecap="round"/>

  <!-- MASSIVE, PENDULOUS, OVERHANGING ENGLISH BULLDOG JOWLS / FLEWS -->
  <path d="M24 77
           C18 84, 19 99, 31 103
           C40 106, 48 102, 54 96
           L66 96
           C72 102, 80 106, 89 103
           C101 99, 102 84, 96 77
           C88 69, 32 69, 24 77 Z"
        fill="url(#jowlGrad)" stroke="#9e6d47" stroke-width="1.5"/>

  <!-- Protruding, broad upturned lower jaw / chin (classic bulldog underbite) -->
  <path d="M41 95 C41 106, 79 106, 79 95 C75 91, 45 91, 41 95 Z" fill="#efe2d4" stroke="#b59479" stroke-width="1.2"/>
  <!-- Dark mouth interior / lower lip edge -->
  <path d="M40 93 Q60 99 80 93 Q75 101 60 101 Q45 101 40 93 Z" fill="#2c1d19"/>
  <!-- Cute little pink bulldog tongue peeking slightly out of the underbite -->
  <path d="M54 96.5 Q60 106 66 96.5 Z" fill="#eb6e86" stroke="#b8445c" stroke-width="0.9"/>
  <path d="M60 96.5 L60 101.5" stroke="#c94f68" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Two iconic tiny white lower bulldog canine teeth peeking up over the lip -->
  <path d="M46.5 94.8 L49 89.2 L51.6 95.3 Z" fill="#ffffff" stroke="#c9beb2" stroke-width="0.8"/>
  <path d="M73.5 94.8 L71 89.2 L68.4 95.3 Z" fill="#ffffff" stroke="#c9beb2" stroke-width="0.8"/>

  <!-- Heavy black-rimmed scalloped lip/jowl edges -->
  <path d="M26 95 C32 101, 43 99, 53 91 C57 88, 63 88, 67 91 C77 99, 88 101, 94 95"
        fill="none" stroke="#291c18" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Whisker dimples on heavy white jowls -->
  <circle cx="31" cy="87" r="1.4" fill="#a88870"/>
  <circle cx="36" cy="91" r="1.4" fill="#a88870"/>
  <circle cx="28" cy="91.5" r="1.2" fill="#a88870"/>
  <circle cx="89" cy="87" r="1.4" fill="#a88870"/>
  <circle cx="84" cy="91" r="1.4" fill="#a88870"/>
  <circle cx="92" cy="91.5" r="1.2" fill="#a88870"/>

  <!-- ICONIC THICK ENGLISH BULLDOG NOSE ROPE (meaty skin roll right over the nose) -->
  <path d="M36 72 C42 61, 78 61, 84 72 C76 76, 44 76, 36 72 Z"
        fill="url(#noseRopeGrad)" stroke="#75411b" stroke-width="1.6"/>
  <path d="M43 68 Q60 63.5 77 68" fill="none" stroke="#f0be88" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>

  <!-- BROAD, FLAT, PUSHED-IN BLACK ENGLISH BULLDOG NOSE -->
  <path d="M46 74.5
           C46 69.5, 74 69.5, 74 74.5
           C74 81.5, 67 84.5, 60 84.5
           C53 84.5, 46 81.5, 46 74.5 Z"
        fill="url(#noseGrad)" stroke="#120c0a" stroke-width="1.3"/>
  <!-- Wide bulldog nostrils -->
  <ellipse cx="53.2" cy="76.8" rx="3.1" ry="2.2" transform="rotate(-18 53.2 76.8)" fill="#0a0706"/>
  <ellipse cx="66.8" cy="76.8" rx="3.1" ry="2.2" transform="rotate(18 66.8 76.8)" fill="#0a0706"/>
  <!-- Subtle nose bridge highlight & center philtrum -->
  <ellipse cx="57" cy="72.6" rx="4.2" ry="1.4" fill="#ffffff" opacity="0.22"/>
  <path d="M60 84.5 L60 89.5" stroke="#291c18" stroke-width="2.2" stroke-linecap="round"/>

  <!-- FESTIVE SANTA HAT perched jauntily over his broad brow -->
  <path d="M23 40
           C28 15, 56 6, 82 13
           C96 17, 105 27, 106 36
           L89 34
           C82 25, 69 23, 56 27
           L95 40 Z"
        fill="url(#hatRed)" stroke="#7d0b18" stroke-width="1.5"/>
  <!-- Soft fabric highlight on Santa hat -->
  <path d="M29 35 C34 17, 56 10, 81 15.5" fill="none" stroke="#ff7a88" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>

  <!-- Fluffy scalloped white Santa hat pom-pom -->
  <circle cx="106.5" cy="36.5" r="8.5" fill="url(#furTrim)" stroke="#cfd8e3" stroke-width="1.3"/>

  <!-- Plush fluffy white Santa hat fur brim -->
  <path d="M18 37
           C18 31, 24 29, 32 30
           C43 27.5, 77 27.5, 88 30
           C96 29, 102 31, 102 37
           C102 42.5, 96 44.5, 88 43.5
           C75 45, 45 45, 32 43.5
           C24 44.5, 18 42.5, 18 37 Z"
        fill="url(#furTrim)" stroke="#cfd8e3" stroke-width="1.3"/>

  <!-- Gold jingle bell on collar -->
  <circle cx="60" cy="115.5" r="5.5" fill="url(#goldBell)" stroke="#8c6210" stroke-width="1.3"/>
  <path d="M56.5 116.5 Q60 118.5 63.5 116.5" fill="none" stroke="#7a530b" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="60" cy="117.6" r="1.1" fill="#7a530b"/>
</svg>
